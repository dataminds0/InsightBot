services:
  mongo:
    image: mongo:8.0
    container_name: insightbot-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  prefect:
    image: prefecthq/prefect:3-python3.12
    container_name: insightbot-prefect
    restart: unless-stopped
    ports:
      - "127.0.0.1:4200:4200"
    environment:
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_UI_API_URL=http://127.0.0.1:4200/api
    volumes:
      - prefect_data:/root/.prefect
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
    name: insightbot_mongo_data
  prefect_data:
    name: insightbot_prefect_data
