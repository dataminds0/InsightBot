[project]
name = "insightbot"
version = "0.1.0"
description = "Multilingual news workspace with real-source ingestion and analysis"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "InsightBot Contributors" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pymongo>=4.10.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "trafilatura>=1.12.0",
    "typer>=0.12.5",
    "argon2-cffi>=23.1.0",
    "bcrypt>=4.2.0",
    "pytz>=2024.2",
    "pyyaml>=6.0.2",
    "beautifulsoup4>=4.15.0",
]

[project.scripts]
insightbot = "insightbot.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "types-pyyaml>=6.0.12",
    "types-pytz>=2024.2.0",
    "mongomock>=4.3.0",
]
research = [
    "pandas>=2.2.0",
    "jupyter>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insightbot"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "Interface",
    "scripts",
    "flow",
    "notebooks",
    "apps",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
